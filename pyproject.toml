[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grn-timecourse-protocol"
version = "0.1.0"
description = "Leakage-controlled synthetic perturbation time-course experiment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
train = ["torch>=2.5"]
dev = ["torch>=2.5", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
